[shell]
clipboard_enabled = true
setup_wizard_enabled = false

[bar.main]
position = "top"
start = ["workspaces"]
center = ["clock"]
end = ["input_volume", "volume", "clipboard"]

[lockscreen]
enabled = true
lock_before_suspend = true
fingerprint = false
allow_empty_password = false

[idle]
pre_action_fade_seconds = 0.0

[idle.behavior.lock]
enabled = true
timeout = 600
action = "lock"
